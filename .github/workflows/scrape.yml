name: Hourly snapshot

on:
  schedule:
    # GitHub drops most scheduled runs under load (since October this job fired every 4-8 h).
    # Four slots an hour give it more chances; run.py skips a slot when the snapshot is fresh,
    # and the scraper fills any hour that still slips through from reforgermods.net's history.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scrape and build
        run: python run.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
      # One Discord message shows the flagship card and is edited after each new snapshot.
      # Skipped until the DISCORD_STATS_WEBHOOK secret exists; a Discord failure never costs the snapshot.
      - name: Check the Discord card
        id: card
        continue-on-error: true
        env:
          DISCORD_STATS_WEBHOOK: ${{ secrets.DISCORD_STATS_WEBHOOK }}
        run: python discord/post_card.py --check ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
      # Milestone cards go to their own channel (DISCORD_MILESTONE_WEBHOOK), once per threshold.
      - name: Check for milestones
        id: milestones
        continue-on-error: true
        env:
          DISCORD_MILESTONE_WEBHOOK: ${{ secrets.DISCORD_MILESTONE_WEBHOOK }}
        run: python discord/milestones.py --check
      - name: Install the card renderer
        if: steps.card.outputs.due == 'true' || steps.milestones.outputs.due == 'true'
        run: pip install playwright==1.52.0
      - name: Update the Discord card
        if: steps.card.outputs.due == 'true'
        continue-on-error: true
        env:
          DISCORD_STATS_WEBHOOK: ${{ secrets.DISCORD_STATS_WEBHOOK }}
        run: python discord/post_card.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
      - name: Post milestones
        if: steps.milestones.outputs.due == 'true'
        continue-on-error: true
        env:
          DISCORD_MILESTONE_WEBHOOK: ${{ secrets.DISCORD_MILESTONE_WEBHOOK }}
        run: python discord/milestones.py
      - name: Commit snapshot
        run: |
          git config user.name "armahq-stats bot"
          git config user.email "armahq-stats@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "snapshot $(date -u +'%Y-%m-%d %H:%M') UTC"
            # A push to main during the run (a code change) must not cost this snapshot.
            git pull --rebase origin main
            git push
          fi

name: Hourly ArmaHQ snapshot

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scrape and build
        run: python run.py
      - name: Commit snapshot
        run: |
          git config user.name "armahq-stats bot"
          git config user.email "armahq-stats@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "snapshot $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
